<!DOCTYPE html>
<html>

<head>

    <title>Todo App</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        body{
            background: linear-gradient(to right,#141e30,#243b55);
            min-height:100vh;
        }

        .main-card{
            border:none;
            border-radius:20px;
        }

        .task-box{
            border-radius:15px;
            transition:0.3s;
        }

        .task-box:hover{
            transform:scale(1.01);
        }

        .completed{
            text-decoration: line-through;
            color:gray;
        }

        .navbar{
            background:#00000040;
            backdrop-filter: blur(10px);
        }

    </style>

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark shadow">

        <div class="container">

            <a class="navbar-brand fw-bold fs-3">
                <i class="fa-solid fa-list-check"></i>
                Todo App
            </a>

            <span class="text-white">

                Total Tasks :
                <b>{{tasks|length}}</b>

            </span>

        </div>

    </nav>

    <div class="container mt-5">

        <div class="card shadow-lg p-4 main-card">

            <h1 class="text-center fw-bold mb-4">

                Django Todo App 

            </h1>

            <!-- Search -->

            <form method="GET">

                <div class="row g-2">

                    <div class="col-md-10">

                        <input
                            type="text"
                            name="search"
                            class="form-control form-control-lg"
                            placeholder="Search Task..."
                        >

                    </div>

                    <div class="col-md-2">

                        <button class="btn btn-dark btn-lg w-100">

                            <i class="fa-solid fa-magnifying-glass"></i>

                        </button>

                    </div>

                </div>

            </form>

            <br>

            <!-- Add Task -->

            <form method="POST">

                {% csrf_token %}

                <div class="row g-2">

                    <div class="col-md-10">

                        <input
                            type="text"
                            name="task"
                            class="form-control form-control-lg"
                            placeholder="Enter New Task"
                        >

                    </div>

                    <div class="col-md-2">

                        <button class="btn btn-primary btn-lg w-100">

                            <i class="fa-solid fa-plus"></i>

                        </button>

                    </div>

                </div>

            </form>

            <hr>

            <!-- Empty Message -->

            {% if tasks %}

                {% for i in tasks %}

                <div class="task-box shadow-sm border p-3 mb-3 d-flex justify-content-between align-items-center">

                    <div>

                        {% if i.completed %}

                            <h4 class="completed">

                                ✅ {{i.title}}

                            </h4>

                        {% else %}

                            <h4>

                                {{i.title}}

                            </h4>

                        {% endif %}

                    </div>

                    <div class="d-flex gap-2">

                        <!-- Complete -->

                        <a href="/complete/{{i.id}}/"
                           class="btn btn-success">

                            <i class="fa-solid fa-check"></i>

                        </a>

                        <!-- Update -->

                        <a href="/update/{{i.id}}/"
                           class="btn btn-warning">

                            <i class="fa-solid fa-pen"></i>

                        </a>

                        <!-- Delete -->

                        <a href="/delete/{{i.id}}/"
                           class="btn btn-danger">

                            <i class="fa-solid fa-trash"></i>

                        </a>

                    </div>

                </div>

                {% endfor %}

            {% else %}

                <div class="alert alert-info text-center">

                    <h4>
                        No Tasks Found 
                    </h4>

                </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
